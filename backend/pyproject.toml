[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend — FastAPI market data, portfolio, and LLM chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # zoneinfo.ZoneInfo("America/New_York") (app/market/massive.py) needs IANA tzdata,
    # which python:3.12-slim (PLAN.md §11's Dockerfile base) does not ship. Harmless
    # on platforms that already have system tzdata.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
